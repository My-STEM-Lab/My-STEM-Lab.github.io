  - title: "Physics & Maths Tutor — GCSE Physics"
    type: "Past papers"
    description: "Past papers, mark schemes and topic-by-topic question sets."
    url: "https://www.physicsandmathstutor.com/past-papers/gcse-physics/"
    external: true

gcse-computer-science:
