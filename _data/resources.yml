# ---------------------------------------------------------------------------
#  FREE RESOURCES
#
#  To add a resource, find the subject key below and add a new "- title:" block.
#  Nothing else needs changing — it appears on the subject page and the
#  /resources/ hub automatically.
#
#  Fields:
#    title       (required) what it's called
#    type        Notes | Worksheet | Past papers | Practice | Video | Tool
#    description one sentence on what it is and who it helps
#    url         either an external link, or /assets/resources/your-file.pdf
#                for a file you've put in the assets/resources/ folder
#    external    true if the link goes to another website (adds an icon)
#    featured    true to pin it to the top of the list
# ---------------------------------------------------------------------------

