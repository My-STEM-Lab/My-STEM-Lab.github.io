tmua:
  - title: "Necessary or sufficient? — interactive drill"
    type: "Practice"
    description: "Ten Paper 2 questions with instant feedback, and a diagnosis of which direction you keep missing."
    url: "/quizzes/tmua-necessary-sufficient/"
    featured: true
  - title: "Official TMUA information and sample tests"
    type: "Practice"
    description: "The official test provider. Specification, format and free sample tests — the samples need a free account and open through Pearson VUE."
    url: "https://www.esat-tmua.ac.uk/"
    external: true
    featured: true
  - title: "Underground Mathematics"
    type: "Practice"
    description: "Excellent preparation for Paper 2 reasoning: logic, proof, necessary and sufficient conditions."
    url: "https://undergroundmathematics.org/"
    external: true

step:
  - title: "STEP Support Programme (Cambridge)"
    type: "Practice"
    description: "Free, structured 25-module programme from the University of Cambridge. If you do one thing for STEP, do this."
    url: "https://step.maths.org/"
    external: true
    featured: true
  - title: "STEP Questions Database"
    type: "Past papers"
    description: "Every STEP question from 1986 to 2018 in one searchable database — filter by paper, topic or year to drill a single weakness."
    url: "https://step.maths.org/questions"
    external: true
    featured: true
  - title: "Worked solutions to recent STEP papers"
    type: "Past papers"
    description: "Fully worked solutions with commentary for STEP 2 and 3 from 2019 onwards — the years the questions database doesn't reach."
    url: "https://step.maths.org/worked-step-papers"
    external: true

esat:
  - title: "Official ESAT information and sample tests"
    type: "Practice"
    description: "Specification, module structure and free sample material for the Engineering and Science Admissions Test. Samples need a free account via Pearson VUE."
    url: "https://www.esat-tmua.ac.uk/"
    external: true
    featured: true
  - title: "Isaac Physics"
    type: "Practice"
    description: "The physics section of ESAT rewards fast, accurate problem solving — Isaac's problem sets are ideal training."
