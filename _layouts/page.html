---
layout: default
---
<header class="page-head">
  <div class="wrap">
    <div class="narrow">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
    </div>
  </div>
</header>

<div class="wrap prose">
  {{ content }}
</div>

{% unless page.hide_cta %}{% include cta.html %}{% endunless %}
