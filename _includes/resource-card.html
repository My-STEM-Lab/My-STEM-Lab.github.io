<li class="resource{% if include.r.featured %} resource-featured{% endif %}">
  <a href="{{ include.r.url }}"{% if include.r.external %} target="_blank" rel="noopener"{% endif %}>
    <span class="resource-head">
      <span class="tag">{{ include.r.type | default: "Resource" }}</span>
      {% if include.r.featured %}<span class="tag tag-star">Start here</span>{% endif %}
    </span>
    <span class="resource-title">
      {{ include.r.title }}
      {% if include.r.external %}<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>{% endif %}
    </span>
    <span class="resource-desc">{{ include.r.description }}</span>
  </a>
</li>
